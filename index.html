<script>
async function hashPw(pw) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function checkPw() {
  const input = document.getElementById('pw').value;
  const hash = await hashPw(input);
  // SHA-256 of the password
  if (hash === 'b15f0265deffcd23a4300934bd0ffe89393f90e21e5dd1bc0f4658a58fa6767e') {
    document.getElementById('lock').style.display = 'none';
    document.getElementById('root').style.display = 'block';
    sessionStorage.setItem('mealplan_auth', 'true');
  } else {
    document.getElementById('err').style.display = 'block';
    document.getElementById('pw').value = '';
    document.getElementById('pw').focus();
  }
}
// Remember during this browser session
if (sessionStorage.getItem('mealplan_auth') === 'true') {
  document.getElementById('lock').style.display = 'none';
  document.getElementById('root').style.display = 'block';
}
</script>

function NutrientRing(props) {
  const pct = Math.min((props.value / props.target) * 100, 100);
  const r = 30, circ = 2 * Math.PI * r;
  const offset = circ - (pct / 100) * circ;
  const sc = pct >= 90 ? "#27AE60" : pct >= 60 ? "#F39C12" : "#E74C3C";
  return e("div", { style: { textAlign: "center", minWidth: 80 } },
    e("svg", { width: 68, height: 68, viewBox: "0 0 68 68" },
      e("circle", { cx: 34, cy: 34, r, fill: "none", stroke: "#1a1a2e", strokeWidth: 5 }),
      e("circle", { cx: 34, cy: 34, r, fill: "none", stroke: props.color, strokeWidth: 5,
        strokeDasharray: circ, strokeDashoffset: offset, strokeLinecap: "round",
        transform: "rotate(-90 34 34)", style: { transition: "stroke-dashoffset 0.6s ease" } }),
      e("text", { x: 34, y: 32, textAnchor: "middle", fill: "#e0e0e0", fontSize: 12, fontWeight: 700 }, Math.round(pct) + "%"),
      e("text", { x: 34, y: 44, textAnchor: "middle", fill: sc, fontSize: 11 }, pct >= 90 ? "\u2713" : pct >= 60 ? "\u2192" : "!"),
    ),
    e("div", { style: { fontSize: 10, color: "#b0b0b0", marginTop: 2 } }, props.label),
    e("div", { style: { fontSize: 9, color: "#666" } }, props.value + "/" + props.target + props.unit),
  );
}

function MealCard(props) {

  return e("div", { onClick: function() { setOpen(!open); }, style: {
    background: "linear-gradient(135deg, #16213e, #1a1a2e)", borderRadius: 12, padding: "12px 14px",
    marginBottom: 8, cursor: "pointer", border: "1px solid " + (open ? tc[props.type] + "66" : "#2a2a4a"),
    transition: "all 0.3s ease", WebkitUserSelect: "none",
  }},
    e("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center" } },
      e("div", { style: { display: "flex", alignItems: "center", gap: 8, flex: 1, minWidth: 0 } },

         { l: "Na", v: m.sodium, u: "mg", c: "#E74C3C" }, { l: "Vit C", v: m.vitC, u: "mg", c: "#E67E22" }

        })
      ),
    ) : null,
  );
}

function GrocerySection(props) {
  const [open, setOpen] = useState(false);
  const [checked, setChecked] = useState({});
  function toggle(idx) { setChecked(function(p) { var n = Object.assign({}, p); n[idx] = !n[idx]; return n; }); }
  var done = Object.values(checked).filter(Boolean).length;
  return e("div", { style: { background: "#16213e", borderRadius: 12, marginBottom: 8, overflow: "hidden" } },
    e("div", { onClick: function() { setOpen(!open); }, style: { padding: "12px 14px", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center" } },
      e("div", { style: { display: "flex", alignItems: "center", gap: 8 } },
        e("span", { style: { fontSize: 20 } }, props.emoji),
        e("span", { style: { color: "#e0e0e0", fontWeight: 600, fontSize: 14 } }, props.title),
      ),
      e("div", { style: { display: "flex", gap: 8, alignItems: "center" } },
        e("span", { style: { fontSize: 11, color: done === props.items.length ? "#27AE60" : "#888" } }, done + "/" + props.items.length),
        e("span", { style: { fontSize: 12, color: "#555", transform: open ? "rotate(180deg)" : "rotate(0)", transition: "transform 0.2s" } }, "\u25BC"),
      ),
    ),
    open ? e("div", { style: { padding: "0 14px 12px" } },
      props.items.map(function(item, i) {
        return e("div", { key: i, onClick: function(ev) { ev.stopPropagation(); toggle(i); }, style: {
          display: "flex", alignItems: "center", gap: 8, padding: "7px 0",
          borderBottom: i < props.items.length - 1 ? "1px solid #1a1a2e" : "none", cursor: "pointer",
        }},
          e("div", { style: {
            width: 20, height: 20, borderRadius: 5, border: "2px solid " + (checked[i] ? "#27AE60" : "#444"),
            background: checked[i] ? "#27AE60" : "transparent", display: "flex", alignItems: "center", justifyContent: "center",
            transition: "all 0.2s", flexShrink: 0,
          }}, checked[i] ? e("span", { style: { color: "#fff", fontSize: 12 } }, "\u2713") : null),
          e("span", { style: { fontSize: 13, color: checked[i] ? "#666" : "#b0b0b0", textDecoration: checked[i] ? "line-through" : "none", transition: "all 0.2s", lineHeight: 1.4 } }, item),
        );
      })
    ) : null,
  );
}

          ),
        ),
      ) : null,

      // GROCERY VIEW
      view === "grocery" ? e("div", null,
        e("div", { style: { fontSize: 14, color: "#F39C12", fontWeight: 600, marginBottom: 4 } }, "4-Week Grocery List"),
        e("div", { style: { fontSize: 11, color: "#666", marginBottom: 14 } }, "Tap categories to expand \u00B7 Check items as you shop"),
        Object.entries(groceryList).map(function(entry) {
          return e(GrocerySection, { key: entry[0], title: entry[0], items: entry[1].items, emoji: entry[1].emoji });
        })
      ) : null,

      // DIET RULES VIEW
      view === "guide" ? e("div", null,
        e("div", { style: { fontSize: 14, color: "#F39C12", fontWeight: 600, marginBottom: 4 } }, "Mom's Dietary Rules"),
        e("div", { style: { fontSize: 11, color: "#666", marginBottom: 14 } }, "Based on her medical records & current recovery"),
        CONDITIONS.map(function(c, i) {
          var bc = c.status === "critical" ? "#E74C3C" : c.status === "warning" ? "#F39C12" : "#3498DB";
          return e("div", { key: i, style: { background: "#16213e", borderRadius: 10, padding: "10px 14px", marginBottom: 6, borderLeft: "3px solid " + bc } },
            e("div", { style: { display: "flex", alignItems: "center", gap: 6, marginBottom: 4 } },
              e("span", { style: { fontSize: 16 } }, c.icon),
              e("span", { style: { fontSize: 13, fontWeight: 600, color: "#e0e0e0" } }, c.name),
              e("span", { style: { fontSize: 9, padding: "1px 6px", borderRadius: 4, marginLeft: "auto", background: bc + "22", color: bc, textTransform: "uppercase", fontWeight: 600, letterSpacing: 0.5 } }, c.status),
            ),
            e("div", { style: { fontSize: 11, color: "#a0a0a0", lineHeight: 1.5 } }, c.rule),
          );
        }),
        // Med interactions
        e("div", { style: { background: "linear-gradient(135deg, #0f3460, #16213e)", borderRadius: 12, padding: 14, marginTop: 14, border: "1px solid #F39C1233" } },
          e("div", { style: { fontSize: 12, fontWeight: 700, color: "#F39C12", marginBottom: 8 } }, "\u2695\uFE0F MEDICATION-FOOD INTERACTIONS"),
          ["Rosuvastatin: Avoid grapefruit juice (OK to eat grapefruit hours apart from bedtime dose)",
           "Iron-rich foods: Pair with Vitamin C for absorption. Separate from dairy by 2 hours",
           "Pantoprazole: Take 30 min before breakfast. Avoid peppermint",
           "Lovenox/Aspirin: Keep Vitamin K intake CONSISTENT daily",
           "Entresto: Avoid high-potassium salt substitutes",
          ].map(function(tip, i) {
            return e("div", { key: i, style: { fontSize: 11, color: "#b0b0b0", padding: "5px 0", borderBottom: i < 4 ? "1px solid #1a1a2e" : "none", lineHeight: 1.5 } }, "\u{1F48A} " + tip);
          })
        ),
        // Safety reminder
        e("div", { style: { background: "#E74C3C11", border: "1px solid #E74C3C33", borderRadius: 10, padding: 14, marginTop: 12 } },
          e("div", { style: { fontSize: 12, fontWeight: 700, color: "#E74C3C", marginBottom: 6 } }, "\u26A0\uFE0F SAFETY REMINDER"),
          e("div", { style: { fontSize: 11, color: "#b0b0b0", lineHeight: 1.6 } },
            "Always confirm dietary changes with Mom's attending physician or rehab dietitian, especially regarding her recovering kidneys, blood thinner regimen, and sensitive stomach. This plan is a guide \u2014 her care team has the final word."
          ),
        ),
      ) : null,
    ),
  );
}

ReactDOM.render(e(App), document.getElementById("root"));
</script>
</body>
</html>
